# Phase 2c: H8 Library Composition Testing
# =========================================
# Tests 5 library compositions at optimal M/E and temperature.
# (Scale-16 and Scale-32 deferred per E11: HP pool exhausted at 4.)
#
# Usage:
#   python scripts/run_study.py studies/phase2c-h8-library.yaml
#   python scripts/run_study.py studies/phase2c-h8-library.yaml --dry-run
#
# Prerequisites:
#   - Phase 2a complete (optimal M/E determined)
#   - Phase 2b complete (optimal temperature determined)
#   - Update 'carried_forward' below with Phase 2a/2b results

study:
  name: "Phase 2c: H8 Library Composition"
  version: "1.0"
  description: |
    Tests 5 library compositions to determine optimal example set.
    Uses optimal M/E from Phase 2a and optimal temperature from Phase 2b.
    Results inform library used in subsequent phases (2d-2e).
    Scale-16 and Scale-32 deferred per E11 (HP pool exhausted at 4).
  phase: "2c"
  hypothesis: "H8"
  created: "2026-01-21"

# Carried forward from prior phases (UPDATE AFTER PHASES 2A/2B ANALYSIS)
carried_forward:
  optimal_me_config: "prompts/configs/detect_image-only.json"  # PLACEHOLDER - update after 2a
  optimal_me_name: "image-only"                                 # PLACEHOLDER - update after 2a
  optimal_temperature: 1.0                                      # PLACEHOLDER - update after 2b

# Factor under test
factors:
  library_composition:
    description: "Example library composition and scaling"
    levels:
      - name: "pure-positive-canon"
        config: "prompts/configs/library_pure-positive-canon.json"
        description: "Canon+ (4), null (3) = 7 examples"
        composition:
          canonical_positive: 4
          canonical_negative: 0
          hard_positive: 0
          hard_negative: 0
          null_examples: 3
          total: 7
      - name: "canonical"
        config: "prompts/configs/library_canonical.json"
        description: "Canon+ (4), Canon- (2), null (3) = 9 examples"
        composition:
          canonical_positive: 4
          canonical_negative: 2
          hard_positive: 0
          hard_negative: 0
          null_examples: 3
          total: 9
      - name: "plus-hp"
        config: "prompts/configs/library_plus-hp.json"
        description: "Canon+ (4), HP (4), Canon- (2), null (3) = 13 examples"
        composition:
          canonical_positive: 4
          canonical_negative: 2
          hard_positive: 4
          hard_negative: 0
          null_examples: 3
          total: 13
      - name: "scale-4"
        config: "prompts/configs/library_scale-4.json"
        description: "Canon+ (4), HP (2), Canon- (2), HN (2), null (3) = 13 examples"
        composition:
          canonical_positive: 4
          canonical_negative: 2
          hard_positive: 2
          hard_negative: 2
          null_examples: 3
          total: 13
      - name: "scale-8"
        config: "prompts/configs/library_scale-8.json"
        description: "Canon+ (4), HP (4), Canon- (2), HN (4), null (3) = 17 examples"
        composition:
          canonical_positive: 4
          canonical_negative: 2
          hard_positive: 4
          hard_negative: 4
          null_examples: 3
          total: 17

# DEFERRED per E11: HP pool exhausted at 4 hard positives.
# Scale-16 requires 8 HP and Scale-32 requires 16 HP, which are unavailable.
# These conditions remain in the preregistered design but cannot be executed
# without additional training data. See protocol-errata.md E11.
#
#     - name: "scale-16"
#       config: "prompts/configs/library_scale-16.json"
#       description: "Canon+ (4), HP (8), Canon- (2), HN (8), null (3) = 25 examples"
#       composition:
