# Phase 2b: H7 Temperature Testing — Track 1 (Image-Using)
# =========================================================
# Tests 5 temperature levels at brief-text-image (best image-using M/E
# from Phase 2a). This is the preregistered OFAT path.
#
# Part of the dual-track carry-forward (Decision 16, Erratum E27):
#   Track 1 (this file): brief-text-image — full preregistered OFAT sequence
#   Track 2 (phase2b-h7-temperature-text-only.yaml): brief-text — targeted tests
#
# Usage:
#   python scripts/run_phase2.py studies/phase2b-h7-temperature.yaml
#   python scripts/run_phase2.py studies/phase2b-h7-temperature.yaml --dry-run
#
# Prerequisites:
#   - Phase 2a complete (optimal M/E determined)

study:
  name: "Phase 2b: H7 Temperature — Track 1 (brief-text-image)"
  version: "2.0"
  description: |
    Tests 5 temperature levels at the best image-using M/E from Phase 2a
    (brief-text-image, F1=0.4617). Results inform temperature used in
    subsequent image-track phases (2c-2e).

    Dual-track context: Phase 2a found text-only brief-text (F1=0.5425)
    outperformed all image-using conditions, but no pairwise differences
    survived FDR correction. Both the best text-only and best image-using
    M/E levels are carried forward independently. See Decision 16.
  phase: "2b"
  hypothesis: "H7"
  created: "2026-01-21"
  updated: "2026-02-06"

# Carried forward from Phase 2a
carried_forward:
  optimal_me_config: "prompts/configs/detect_brief-text-image.json"
  optimal_me_name: "brief-text-image"
  source: "Phase 2a — best image-using M/E (F1=0.4617)"

# Factor under test
factors:
  temperature:
    description: "Model temperature (controls output randomness)"
    levels:
      - name: "T0.0"
        value: 0.0
        description: "Minimum (deterministic)"
      - name: "T0.3"
        value: 0.3
        description: "Low variance"
      - name: "T0.7"
        value: 0.7
        description: "Moderate variance"
      - name: "T1.0"
        value: 1.0
        description: "Vendor default (also tested in Phase 2a)"
      - name: "T1.3"
        value: 1.3
        description: "Above default"

# Fixed parameters
fixed:
  ordering: "canonical-first"
  # M/E and library defined by optimal_me_config

inputs:
  manifest: "inputs/tiles/validation_manifest.json"
  ground_truth: "inputs/vectors/references/mounds-reference.geojson"
  bounds: "inputs/vectors/bounds/validation_bounds.geojson"

execution:
  runs: 10          # K=10 independent single-pass runs (§3.8)
  output_dir: "outputs/phase2b/track1-image"
  checkpoint_dir: "outputs/phase2b/track1-image/checkpoints"

# Command pattern for execution
command_template: |
  python scripts/4_detect_mounds_batch.py \
    --config {carried_forward.optimal_me_config} \
    --manifest {inputs.manifest} \
    --output-dir {output_dir}/{condition_name}/run_{run}/pass_{pass} \
    --temperature {factor_value}

analysis:
  method: "bootstrap_ci"
  n_iterations: 1000
  fdr_q: 0.05
  planned_contrasts:
    - ["T1.0", "T0.0"]
    - ["T1.0", "T0.3"]
    - ["T1.0", "T0.7"]
    - ["T1.0", "T1.3"]
  metrics:
    - "f1"
    - "precision"
    - "recall"
  output:
    report: "outputs/phase2b/track1-image/analysis_report.json"
    summary: "outputs/phase2b/track1-image/analysis_summary.md"
  notes: |
    Phase 2a data for brief-text-image at T=1.0 is available in
    outputs/phase2a/brief-text-image/run_* (K=10 runs). This can
    supplement the T=1.0 condition here or serve as a replication check.

outputs:
  per_condition:
    - "{output_dir}/{condition_name}/run_{run}/*.geojson"
    - "{output_dir}/{condition_name}/run_{run}/*.meta.json"
  aggregated:
    - "{output_dir}/results_summary.csv"
    - "{output_dir}/analysis_report.json"

estimates:
  cells: 5
  api_calls_per_cell: 600     # 10 runs x 60 tiles (single-pass per §3.8)
  total_api_calls: 3000
  cost_usd: 11
  time_hours: 1

outcome:
  determines: "optimal_temperature_image_track"
  carries_forward_to: "phase2c"
  decision_rule: |
    Select temperature with highest mean F1.
    If T=1.0 (default) is within 0.02 F1 of best, prefer T=1.0 for simplicity.
    Optimal temperature is carried forward independently for the image track.
