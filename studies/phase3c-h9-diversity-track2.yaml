# Phase 3c: H9 Diversity Testing — Track 2 (Text-Only)
# =====================================================
# Tests whether introducing diversity across consensus voting passes
# improves detection accuracy for the text-only modality.
#
# 4-condition design (H9-C image diversity is degenerate for text-only
# since include_example_images=false — no images are sent to the model):
#   A: Baseline — all 5 passes use identical config
#   B: Text diversity — instruction V1-V5 cycled across passes
#   D: Temperature diversity — T_opt +/- offsets across passes
#   E: Full diversity — text + temperature combined (image N/A)
#
# Condition C is omitted: with include_example_images=false, image
# rotation has no effect on model input. This is documented as a
# design decision, not an oversight.
#
# Part of the dual-track validation (Decision 16):
#   Track 1: image-using (phase3c-h9-diversity-track1.yaml)
#   Track 2 (this file): text-only
#
# Usage:
#   python scripts/run_phase2.py studies/phase3c-h9-diversity-track2.yaml --dry-run
#   python scripts/run_phase2.py studies/phase3c-h9-diversity-track2.yaml --mode batch
#   python scripts/run_phase2.py studies/phase3c-h9-diversity-track2.yaml --mode batch --resume

study:
  name: "Phase 3c: H9 Diversity — Track 2 (Text-Only)"
  version: "1.0"
  description: |
    Tests whether introducing diversity across consensus voting passes
    improves detection accuracy for the text-only track (H9).

    Text-only modality (include_example_images=false) means image
    diversity (H9-C) is degenerate — only text and temperature diversity
    are testable. Condition E combines both.

    All conditions use HIGH thinking level. Temperature is fixed at T=0.7
    (Phase 3a optimum) except where varied as the diversity dimension.
  phase: "3c"
  hypothesis: "H9"
  created: "2026-03-07"

carried_forward:
  optimal_me_config: "prompts/configs/detect_brief-text.json"
  optimal_me_name: "brief-text"
  optimal_temperature: 0.7
  optimal_thinking: "high"
  source: "Phase 3a — T=0.7 best for text track (F1=0.751 at N=30, x=22)"

inputs:
  manifest: "inputs/tiles/validation_manifest.json"
  ground_truth: "inputs/vectors/references/mounds-reference.geojson"
  bounds: "inputs/vectors/bounds/validation_bounds.geojson"

execution:
  runs: 5              # K=5 replications per sub-condition
  workers: 1           # Safe default; pass --workers N at CLI
  output_dir: "outputs/phase3c/track2-text"
  checkpoint_dir: "outputs/phase3c/track2-text/checkpoints"

# Pre-enumerated conditions (20 sub-conditions = 4 conditions x 5 passes)
conditions:

  # ── Condition A: Baseline (identical passes) ──────────────────────
  - name: "h9-A-p1"
    config: "prompts/configs/phase3c-t2-h9A.json"
    description: "Baseline — identical pass 1"
  - name: "h9-A-p2"
    config: "prompts/configs/phase3c-t2-h9A.json"
    description: "Baseline — identical pass 2"
  - name: "h9-A-p3"
    config: "prompts/configs/phase3c-t2-h9A.json"
    description: "Baseline — identical pass 3"
  - name: "h9-A-p4"
    config: "prompts/configs/phase3c-t2-h9A.json"
    description: "Baseline — identical pass 4"
  - name: "h9-A-p5"
    config: "prompts/configs/phase3c-t2-h9A.json"
    description: "Baseline — identical pass 5"

  # ── Condition B: Text diversity (V1-V5 instruction variants) ──────
  - name: "h9-B-v1"
    config: "prompts/configs/phase3c-t2-h9B-v1.json"
    description: "Text diversity — instruction variant 1 (burial mound / radiating lines)"
  - name: "h9-B-v2"
    config: "prompts/configs/phase3c-t2-h9B-v2.json"
    description: "Text diversity — instruction variant 2 (tumulus / hachure strokes)"
  - name: "h9-B-v3"
    config: "prompts/configs/phase3c-t2-h9B-v3.json"
    description: "Text diversity — instruction variant 3 (kurgan / ray marks)"
  - name: "h9-B-v4"
    config: "prompts/configs/phase3c-t2-h9B-v4.json"
    description: "Text diversity — instruction variant 4 (cartographic symbol / hachures)"
  - name: "h9-B-v5"
    config: "prompts/configs/phase3c-t2-h9B-v5.json"
    description: "Text diversity — instruction variant 5 (mound features / tick marks)"

  # ── Condition C: OMITTED ──────────────────────────────────────────
  # Image diversity is degenerate for text-only (include_example_images=false).
  # All example paths are listed in configs for consistency but images are
  # never sent to the model. Rotating HN examples would not change model
  # input, making C indistinguishable from A.

  # ── Condition D: Temperature diversity ────────────────────────────
  # Same config as A; temperature overridden per sub-condition.
  - name: "h9-D-t1"
    config: "prompts/configs/phase3c-t2-h9A.json"
    temperature: 0.4
    description: "Temperature diversity — T=0.4 (T_opt - 0.30)"
  - name: "h9-D-t2"
    config: "prompts/configs/phase3c-t2-h9A.json"
    temperature: 0.55
    description: "Temperature diversity — T=0.55 (T_opt - 0.15)"
  - name: "h9-D-t3"
    config: "prompts/configs/phase3c-t2-h9A.json"
    temperature: 0.7
    description: "Temperature diversity — T=0.7 (T_opt)"
  - name: "h9-D-t4"
    config: "prompts/configs/phase3c-t2-h9A.json"
    temperature: 0.85
    description: "Temperature diversity — T=0.85 (T_opt + 0.15)"
  - name: "h9-D-t5"
    config: "prompts/configs/phase3c-t2-h9A.json"
    temperature: 1.0
    description: "Temperature diversity — T=1.0 (T_opt + 0.30)"

  # ── Condition E: Full diversity (text + temperature) ──────────────
  # For text-only, "full diversity" = text + temperature (image N/A).
  # Reuses B's config files with temperature overrides.
  - name: "h9-E-p1"
    config: "prompts/configs/phase3c-t2-h9B-v1.json"
    temperature: 0.4
    description: "Full diversity — pass 1 (V1 + T=0.4)"
  - name: "h9-E-p2"
    config: "prompts/configs/phase3c-t2-h9B-v2.json"
    temperature: 0.55
    description: "Full diversity — pass 2 (V2 + T=0.55)"
  - name: "h9-E-p3"
    config: "prompts/configs/phase3c-t2-h9B-v3.json"
    temperature: 0.7
    description: "Full diversity — pass 3 (V3 + T=0.7)"
  - name: "h9-E-p4"
    config: "prompts/configs/phase3c-t2-h9B-v4.json"
    temperature: 0.85
    description: "Full diversity — pass 4 (V4 + T=0.85)"
  - name: "h9-E-p5"
    config: "prompts/configs/phase3c-t2-h9B-v5.json"
    temperature: 1.0
    description: "Full diversity — pass 5 (V5 + T=1.0)"

# Analysis specification
analysis:
  method: "consensus_diversity"
  description: |
    Post-hoc consensus analysis: for each condition, group runs into
    replications (run_k from each sub-condition forms replication k),
    then compute consensus detections using vote threshold sweep.
    Compare F1 across conditions A, B, D, E.
  metrics:
    - "f1"
    - "precision"
    - "recall"
  output:
    report: "results/phase3c-diversity/track2-text/diversity-analysis-report.json"
    summary: "results/phase3c-diversity/track2-text/diversity-analysis-summary.md"

outputs:
  per_condition:
    - "{output_dir}/{condition_name}/run_{run}/*.geojson"
    - "{output_dir}/{condition_name}/run_{run}/*.meta.json"
  aggregated:
    - "results/phase3c-diversity/track2-text/diversity-analysis-report.json"

# Cost estimates (batch mode, 50% discount)
estimates:
  sub_conditions: 20
  runs_per_sub_condition: 5
  total_execution_units: 100          # 20 sub-conditions x 5 runs
  tiles_per_unit: 60
  total_api_calls: 6000               # 100 x 60
  cost_per_call_usd: 0.0006           # Flash text-only, estimated
  cost_batch_discount: 0.50
  cost_usd_total: 1.80                # 6000 x 0.0006 x 0.5
  time_hours: 1.5                     # Batch mode

# Consensus grouping metadata (for analysis script)
consensus_design:
  passes_per_replication: 5
  replications: 5
  grouping_rule: |
    Replication k = {run_k from sub-condition p1, run_k from p2, ..., run_k from p5}
    For Condition A, any 5 runs form a valid replication (all identical).
  conditions:
    A:
      sub_conditions: ["h9-A-p1", "h9-A-p2", "h9-A-p3", "h9-A-p4", "h9-A-p5"]
      diversity_dimensions: []
    B:
      sub_conditions: ["h9-B-v1", "h9-B-v2", "h9-B-v3", "h9-B-v4", "h9-B-v5"]
      diversity_dimensions: ["text"]
    D:
      sub_conditions: ["h9-D-t1", "h9-D-t2", "h9-D-t3", "h9-D-t4", "h9-D-t5"]
      diversity_dimensions: ["temperature"]
    E:
      sub_conditions: ["h9-E-p1", "h9-E-p2", "h9-E-p3", "h9-E-p4", "h9-E-p5"]
      diversity_dimensions: ["text", "temperature"]

outcome:
  determines: "diversity_benefit_text_track"
  decision_rule: |
    For each diversity dimension (B, D, E), compare consensus F1
    against Condition A (identical baseline) using paired permutation
    test on tile-level F1 scores. If any diverse condition shows
    significantly higher F1 (p < 0.05), adopt that diversity mechanism
    for operational use.
