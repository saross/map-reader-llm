# Phase 3a: H3 Consensus Voting Validation — Track 2 (Text-Only)
# ================================================================
# Tests consensus voting at T=0.3 and T=0.7 using the carry-forward
# text-only config (detect_brief-text.json). K=30 runs per temperature
# enable pool sizes N=5, N=10, N=30.
#
# T=0.0 is excluded because the model produces near-deterministic output
# at zero temperature, making consensus voting meaningless (see E32).
#
# This is the first consensus voting test for the text-only track —
# Phase 2b consensus analysis was only run for the image track (canonical
# library), so there is no prior consensus baseline for text-only.
#
# Part of the dual-track validation (Decision 16, Erratum E27):
#   Track 1 (phase3a-h3-voting-track1.yaml): image-using — library_plus-hp.json
#   Track 2 (this file): text-only — detect_brief-text.json
#
# Staged execution:
#   Stage 1: Set execution.runs to 10, run, analyse variation
#   Stage 2: Change runs to 30, run with --resume (20 new per cell)
#
# Usage:
#   python scripts/run_phase2.py studies/phase3a-h3-voting-track2.yaml --dry-run
#   python scripts/run_phase2.py studies/phase3a-h3-voting-track2.yaml --workers 12
#   python scripts/run_phase2.py studies/phase3a-h3-voting-track2.yaml --resume --workers 12
#
# Prerequisites:
#   - Phase 2 complete (optimal M/E, temperature determined)

study:
  name: "Phase 3a: H3 Consensus Voting — Track 2 (Text-Only)"
  version: "1.0"
  description: |
    Tests consensus voting at elevated temperatures (T=0.3, T=0.7) using
    the carry-forward text-only configuration (F1=0.660 at T=0.0).
    T=0.0 is excluded because the model produces near-deterministic output
    at zero temperature, making consensus voting meaningless (Erratum E32).

    This is the first consensus voting analysis for the text-only track.
    Phase 2b retroactive consensus analysis was only performed on the image
    track (canonical library), so no prior text-only consensus baseline exists.

    Text-only prompts have a substantially smaller context window (no base64
    images), which may produce different temperature sensitivity and
    consensus behaviour compared to the image-using track.
  phase: "3a"
  hypothesis: "H3"
  created: "2026-02-12"

# Carried forward from Phases 2a-2b
carried_forward:
  optimal_me_config: "prompts/configs/detect_brief-text.json"
  optimal_me_name: "brief-text"
  source: "Phase 2a — best overall M/E (F1=0.660 at T=0.0)"

# Factor under test
factors:
  temperature:
    description: "Model temperature (controls output randomness for consensus voting diversity)"
    levels:
      - name: "T0.3"
        value: 0.3
        description: "Low variance — tests whether modest stochasticity enables FP filtering"
      - name: "T0.7"
        value: 0.7
        description: "Moderate variance — tests diversity vs noise trade-off"

# Fixed parameters
fixed:
  ordering: "config-default"
  # M/E and instruction defined by optimal_me_config
  # Note: detect_brief-text.json has include_example_images: false,
  # so the example library is in the config but images are not sent

inputs:
  manifest: "inputs/tiles/validation_manifest.json"
  ground_truth: "inputs/vectors/references/mounds-reference.geojson"
  bounds: "inputs/vectors/bounds/validation_bounds.geojson"

execution:
  runs: 10           # Stage 1: K=10 (change to 30 for Stage 2)
  workers: 1         # Safe default; pass --workers N at CLI for parallelism
  output_dir: "outputs/phase3a/track2-text"
  checkpoint_dir: "outputs/phase3a/track2-text/checkpoints"

# Command pattern for execution
command_template: |
  python scripts/4_detect_mounds_batch.py \
    --config {carried_forward.optimal_me_config} \
    --manifest {inputs.manifest} \
    --output-dir {output_dir}/{condition_name}/run_{run} \
    --temperature {factor_value}

analysis:
  method: "consensus_sweep"
  script: "scripts/analyse_consensus_sweep.py"
  args:
    - "--study-dir"
    - "outputs/phase3a/track2-text"
    - "--output-dir"
    - "results/phase3a-consensus/track2-text"
    - "--temperatures"
    - "T0.3"
    - "T0.7"
    - "--pool-sizes"
    - "5"
    - "10"
    - "30"
    - "--baseline-f1"
    - "0.660"
  metrics:
    - "f1"
    - "precision"
    - "recall"
  output:
    report: "results/phase3a-consensus/track2-text/consensus-analysis-report.json"
    summary: "results/phase3a-consensus/track2-text/consensus-analysis-summary.md"
  notes: |
    Stage 1 (K=10): Use --pool-sizes 5 10 only.
    Stage 2 (K=30): Use --pool-sizes 5 10 30.
    Baseline F1=0.660 is the T=0.0 single-run mean from Phase 2b.
    No prior consensus baseline exists for the text-only track.

outputs:
  per_condition:
    - "{output_dir}/{condition_name}/run_{run}/*.geojson"
    - "{output_dir}/{condition_name}/run_{run}/*.meta.json"
  aggregated:
    - "results/phase3a-consensus/track2-text/consensus-sweep-results.csv"
    - "results/phase3a-consensus/track2-text/consensus-analysis-report.json"

estimates:
  cells: 2
  api_calls_per_cell_stage1: 600     # 10 runs x 60 tiles
  api_calls_per_cell_stage2: 1800    # 30 runs x 60 tiles
  total_api_calls_stage1: 1200       # 2 cells x 600
  total_api_calls_stage2: 3600       # 2 cells x 1800
  cost_usd_stage1: 3
  cost_usd_stage2: 8
  time_hours: 1

outcome:
  determines: "consensus_voting_value_text_track"
  carries_forward_to: "phase3b (if consensus improves over baseline)"
  decision_rule: |
    If the best (T, N, x) consensus configuration exceeds the T=0.0
    single-run baseline (F1=0.660), consensus voting is validated for the
    text-only track. The optimal configuration is carried forward.

    Success threshold: any consensus F1 > 0.660 (the T=0.0 ceiling).
    Cost-efficiency: report F1 per additional API dollar for each (T, N, x).
