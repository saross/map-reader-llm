# Phase 2c: H8 Library Composition Testing — Track 2 (Text-Only)
# ================================================================
# Tests 5 library compositions at optimal text-only M/E and temperature.
# (Scale-16 and Scale-32 deferred per E11: HP pool exhausted at 4.)
#
# Part of the dual-track carry-forward (Decision 16, Erratum E27):
#   Track 1 (phase2c-h8-library.yaml): brief-text-image — full preregistered OFAT
#   Track 2 (this file): brief-text — targeted tests where applicable
#
# Usage:
#   python scripts/run_phase2.py studies/phase2c-h8-library-text-only.yaml
#   python scripts/run_phase2.py studies/phase2c-h8-library-text-only.yaml --dry-run
#
# Prerequisites:
#   - Phase 2a complete (optimal M/E determined: brief-text for text track)
#   - Phase 2b complete (optimal temperature determined: T=0.0 for both tracks)

study:
  name: "Phase 2c: H8 Library Composition — Track 2 (brief-text)"
  version: "1.0"
  description: |
    Tests 5 library compositions at the best text-only M/E from Phase 2a
    (brief-text, F1=0.5425) and optimal temperature from Phase 2b (T=0.0,
    F1=0.6602). This track explores whether library composition effects
    differ between text-only and image-using modalities.

    Dual-track context: brief-text unexpectedly outperformed all image-using
    conditions in Phase 2a, but no pairwise differences survived FDR correction.
    Both M/E levels are carried forward independently. See Decision 16.

    Text-only prompts have a substantially smaller context window (no base64
    images), which may cause different sensitivity to library composition
    compared to the image-using track.
  phase: "2c"
  hypothesis: "H8"
  created: "2026-02-08"

# Carried forward from prior phases
carried_forward:
  optimal_me_config: "prompts/configs/detect_brief-text.json"
  optimal_me_name: "brief-text"
  optimal_temperature: 0.0
  source_2a: "Phase 2a — best overall M/E (F1=0.5425) and best text-only"
  source_2b: "Phase 2b Track 2 — optimal temperature (T=0.0, F1=0.6602)"

# Factor under test
factors:
  library_composition:
    description: "Example library composition and scaling"
    levels:
      - name: "pure-positive-canon"
        config: "prompts/configs/library_pure-positive-canon-text.json"
        description: "Canon+ (4), null (3) = 7 examples"
        composition:
          canonical_positive: 4
          canonical_negative: 0
          hard_positive: 0
          hard_negative: 0
          null_examples: 3
          total: 7
      - name: "canonical"
        config: "prompts/configs/library_canonical-text.json"
        description: "Canon+ (4), Canon- (2), null (3) = 9 examples"
        composition:
          canonical_positive: 4
          canonical_negative: 2
          hard_positive: 0
          hard_negative: 0
          null_examples: 3
          total: 9
      - name: "plus-hp"
        config: "prompts/configs/library_plus-hp-text.json"
        description: "Canon+ (4), HP (4), Canon- (2), null (3) = 13 examples"
        composition:
          canonical_positive: 4
          canonical_negative: 2
          hard_positive: 4
          hard_negative: 0
          null_examples: 3
          total: 13
      - name: "scale-4"
        config: "prompts/configs/library_scale-4-text.json"
        description: "Canon+ (4), HP (2), Canon- (2), HN (2), null (3) = 13 examples"
        composition:
          canonical_positive: 4
          canonical_negative: 2
          hard_positive: 2
          hard_negative: 2
          null_examples: 3
          total: 13
      - name: "scale-8"
        config: "prompts/configs/library_scale-8-text.json"
        description: "Canon+ (4), HP (4), Canon- (2), HN (4), null (3) = 17 examples"
        composition:
          canonical_positive: 4
          canonical_negative: 2
          hard_positive: 4
          hard_negative: 4
          null_examples: 3
          total: 17

# DEFERRED per E11: HP pool exhausted at 4 hard positives.
# Scale-16 requires 8 HP and Scale-32 requires 16 HP, which are unavailable.
# These conditions remain in the preregistered design but cannot be executed
# without additional training data. See protocol-errata.md E11.
#
#     - name: "scale-16"
#       config: "prompts/configs/library_scale-16-text.json"
#       description: "Canon+ (4), HP (8), Canon- (2), HN (8), null (3) = 25 examples"
#     - name: "scale-32"
#       config: "prompts/configs/library_scale-32-text.json"
#       description: "Canon+ (4), HP (16), Canon- (2), HN (16), null (3) = 41 examples"

# Fixed parameters
fixed:
  ordering: "canonical-first"
  # M/E and temperature defined by carried_forward values
  # Note: brief-text configs have include_example_images: false,
  # so the example library is in the config but images are not sent

inputs:
  manifest: "inputs/tiles/validation_manifest.json"
  ground_truth: "inputs/vectors/references/mounds-reference.geojson"
  bounds: "inputs/vectors/bounds/validation_bounds.geojson"

execution:
  runs: 10          # K=10 independent single-pass runs (§3.8)
  output_dir: "outputs/phase2c/track2-text"
  checkpoint_dir: "outputs/phase2c/track2-text/checkpoints"

# Command pattern for execution
# Note: Library configs embed the example library; use --temperature to override
command_template: |
  python scripts/4_detect_mounds_batch.py \
    --config {factor_config} \
    --manifest {inputs.manifest} \
    --output-dir {output_dir}/{condition_name}/run_{run}/pass_{pass} \
    --temperature {carried_forward.optimal_temperature}

analysis:
  method: "bootstrap_ci"
  n_iterations: 1000
  fdr_q: 0.05
  planned_contrasts:
    # Sequential addition contrasts (C1-C3)
    - ["pure-positive-canon", "canonical"]   # C1: effect of adding Canon-
    - ["canonical", "plus-hp"]               # C2: effect of adding HP
    - ["plus-hp", "scale-4"]                 # C3 / B1: HP-only vs balanced HP+HN at same total (13)
    # Scaling contrast (S1) — S2/S3 deferred with Scale-16/32 per E11
    - ["scale-4", "scale-8"]                 # S1: scaling from 13 to 17 examples
  metrics:
    - "f1"
    - "precision"
    - "recall"
  output:
    report: "outputs/phase2c/track2-text/analysis_report.json"
    summary: "outputs/phase2c/track2-text/analysis_summary.md"
  notes: |
    Cross-track comparison: after both tracks complete, compare library
    composition effects. If optimal library differs between tracks, this
    informs whether text-only and image-using modalities have different
    sensitivity to example library composition.

outputs:
  per_condition:
    - "{output_dir}/{condition_name}/run_{run}/*.geojson"
    - "{output_dir}/{condition_name}/run_{run}/*.meta.json"
  aggregated:
    - "{output_dir}/results_summary.csv"
    - "{output_dir}/analysis_report.json"

estimates:
  cells: 5                      # 7 preregistered, 2 deferred per E11
  api_calls_per_cell: 600       # 10 runs x 60 tiles (single-pass per §3.8)
  total_api_calls: 3000
  cost_usd: 7                   # Lower than image track (no images in prompt)
  time_hours: 1

outcome:
  determines: "optimal_library_text_track"
  carries_forward_to: "deferred text-only phases"
  decision_rule: |
    Select library with highest mean F1.
    If multiple libraries have overlapping 95% CIs with the best,
    prefer smaller library (fewer examples) for parsimony.
    Note: Scale-16/32 deferred per E11 (HP pool exhausted at 4).
    Optimal library is carried forward independently for the text-only track.
