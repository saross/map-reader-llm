# Phase 2d: H5 Negative Text Treatment — Track 1 (Image-Using)
# ==============================================================
# Tests 3 exclusion guidance levels (Minimal, Terse, Verbose) at the
# carried-forward brief-text-image M/E with plus-hp library.
#
# Part of the dual-track Phase 2d design (Decision 17, Erratum E28):
#   Track 1 (this file): brief-text-image — image-using OFAT
#   Track 2 (phase2d-h5-negtext-text-only.yaml): brief-text — text-only OFAT
#
# OFAT simplification: original preregistered design was 3×3 factorial
# (M/E × H5). Since Phase 2a determined brief-text-image as optimal
# image-using M/E, we test H5 at that level only (single-factor OFAT).
#
# Instruction text adaptation: Guideline 3 and verbose exclusion intro
# trimmed to remove references to negative reference images (HN images
# excluded after Phase 2c). Exclusion descriptions retained as domain
# knowledge. See Decision 17 and Erratum E28.
#
# Usage:
#   python scripts/run_phase2.py studies/phase2d-h5-negtext.yaml
#   python scripts/run_phase2.py studies/phase2d-h5-negtext.yaml --dry-run
#
# Prerequisites:
#   - Phase 2a complete (optimal M/E: brief-text-image)
#   - Phase 2b complete (optimal T=0.0)
#   - Phase 2c complete (optimal library: plus-hp)

study:
  name: "Phase 2d: H5 Negative Text Treatment — Track 1 (brief-text-image)"
  version: "2.0"
  description: |
    Tests 3 exclusion guidance levels (Minimal, Terse, Verbose) at the
    carried-forward brief-text-image M/E with plus-hp library and T=0.0.

    Minimal is the Phase 2c baseline (no exclusion text beyond basic
    "Negative" label). Terse adds a brief "do not mark" list. Verbose
    adds detailed per-type exclusion criteria with visual/key-difference/
    test structure.

    This is an OFAT simplification of the preregistered 3×3 M/E × H5
    factorial: we test H5 at the carried-forward optimal M/E only.
    See Decision 17.
  phase: "2d"
  hypothesis: "H5"
  created: "2026-01-21"
  updated: "2026-02-11"

# Carried forward from prior phases
carried_forward:
  optimal_temperature: 0.0
  optimal_library: "plus-hp"
  optimal_me: "brief-text-image"
  source: "Phase 2a (M/E), Phase 2b (T=0.0), Phase 2c (plus-hp)"

# Factor under test (single-factor OFAT)
factors:
  negative_text_treatment:
    description: "Exclusion guidance level in system instruction"
    levels:
      - name: "minimal"
        description: "No exclusion text — baseline from Phase 2c"
        config: "prompts/configs/library_plus-hp.json"
        run_in_phase2d: false  # Reuse Phase 2c plus-hp results
      - name: "terse"
        description: "Brief exclusion guidance (do-not-mark list)"
        config: "prompts/configs/library_plus-hp_terse.json"
        run_in_phase2d: true
      - name: "verbose"
        description: "Detailed per-type exclusion criteria"
        config: "prompts/configs/library_plus-hp_verbose.json"
        run_in_phase2d: true

# Fixed parameters
fixed:
  ordering: "canonical-first"
  temperature: 0.0
  library: "plus-hp"
  me_level: "brief-text-image"

inputs:
  manifest: "inputs/tiles/validation_manifest.json"
  ground_truth: "inputs/vectors/references/mounds-reference.geojson"
  bounds: "inputs/vectors/bounds/validation_bounds.geojson"

execution:
  runs: 10          # K=10 independent single-pass runs (§3.8)
  output_dir: "outputs/phase2d/track1-image"
  checkpoint_dir: "outputs/phase2d/track1-image/checkpoints"
  cells_to_run: 2   # Terse and Verbose only; Minimal reused from Phase 2c

# Command pattern for execution
command_template: |
  python scripts/4_detect_mounds_batch.py \
    --config {condition_config} \
    --manifest {inputs.manifest} \
    --output-dir {output_dir}/{condition_name}/run_{run} \
    --temperature {carried_forward.optimal_temperature}

analysis:
  method: "bootstrap_ci"
  n_iterations: 1000
  fdr_q: 0.05
  design: "one_way"  # Single-factor OFAT (H5 levels only)
  planned_contrasts:
    - ["minimal", "terse"]
    - ["terse", "verbose"]
  metrics:
    - "f1"
    - "precision"
    - "recall"
  output:
    report: "outputs/phase2d/track1-image/analysis_report.json"
    summary: "outputs/phase2d/track1-image/analysis_summary.md"

outputs:
  per_condition:
    - "{output_dir}/{condition_name}/run_{run}/*.geojson"
    - "{output_dir}/{condition_name}/run_{run}/*.meta.json"
  aggregated:
    - "{output_dir}/results_summary.csv"
    - "{output_dir}/analysis_report.json"

estimates:
  cells: 2          # Net new cells (Terse + Verbose)
  api_calls_per_cell: 600     # 10 runs × 60 tiles (single-pass per §3.8)
  total_api_calls: 1200
  cost_usd: 4.40
  time_hours: 0.5

outcome:
  determines: "optimal_h5_treatment_image_track"
  carries_forward_to: "phase2e"
  decision_rule: |
    Compare F1 across 3 H5 levels (minimal, terse, verbose).
    If terse or verbose significantly improves F1 over minimal:
      Select level with highest mean F1.
    If no significant differences:
      Use Minimal (simplest) as default — Occam's razor.
    Optimal H5 level carried forward to Phase 2e (ordering).
