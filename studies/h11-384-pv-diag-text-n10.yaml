# H11: 384px PV Diagnostic — Text Track N=10
# =============================================
# Runs 10 text-only proposer passes at T=0.7 on the full 384px evaluation area.
# Post-hoc consensus at 1-of-10 through 10-of-10, each fed through PV verifier.
# Subsumes N=5 configurations (use first 5 runs for N=5 subsets).
#
# Part of the 384px PV diagnostic experiment set (4 configs total).
# See planning/h11-384-pv-diagnostic.md for full design.

study:
  name: "H11: 384px PV Diagnostic — Text N=10"
  version: "1.0"
  description: |
    10 text-only proposer passes at T=0.7 on the full 384px evaluation area
    (611 tiles). Post-hoc consensus sweep at all thresholds (1-of-10 through
    10-of-10), each fed through the PV pipeline. Tests whether moderate
    consensus + PV rescues 384px precision while retaining its high recall.
  phase: "h11"
  hypothesis: "H11"
  created: "2026-03-21"

carried_forward:
  optimal_me_config: "prompts/configs/detect_brief-text.json"
  optimal_me_name: "brief-text"
  source: "Phase 3a — text-only optimal; T=0.7 for consensus diversity"

inputs:
  manifest: "inputs/tiles_384/full_evaluation_manifest.json"
  tile_size: 384
  tiles_dir: "inputs/tiles_384"
  ground_truth: "inputs/vectors/references/mounds-reference.geojson"
  bounds: "inputs/vectors/bounds/384/full_evaluation_bounds.geojson"
  # Evaluation uses 512 bounds for fair cross-tile-size comparison
  evaluation_bounds: "inputs/vectors/bounds/full_evaluation_bounds.geojson"

execution:
  runs: 10
  workers: 1
  output_dir: "outputs/h11/pv-diag-384/text-n10"

conditions:
- name: text-t0.7
  config: "prompts/configs/detect_brief-text.json"
  temperature: 0.7
  description: "Text-only proposer, T=0.7, minimal thinking"

estimates:
  tiles: 611
  runs: 10
  total_execution_units: 10
  tiles_per_unit: 611
  total_api_calls: 6110
  cost_per_call_usd: 0.001
  cost_batch_discount: 0.5
  cost_usd_total: 3.06

analysis:
  method: "consensus_sweep_pv"
  description: |
    Post-hoc consensus at all thresholds (1-of-10 through 10-of-10).
    Each threshold's consensus GeoJSON fed through crop extraction + PV
    verifier. Full bootstrap CI evaluation on all 10 verified outputs.
  metrics:
  - "f1"
  - "precision"
  - "recall"
