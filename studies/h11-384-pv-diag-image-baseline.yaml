# H11: 384px PV Diagnostic — Image Baseline (N=1, T=0.0)
# =======================================================
# Single deterministic image-track proposer pass on the full 384px evaluation area.
# Paired with text baseline to test modality effect at single-pass level.
#
# Part of the 384px PV diagnostic experiment set (4 configs total).
# See planning/h11-384-pv-diagnostic.md for full design.

study:
  name: "H11: 384px PV Diagnostic — Image Baseline"
  version: "1.0"
  description: |
    Single deterministic image-track proposer pass (T=0.0) on the full 384px
    evaluation area (611 tiles). Fed directly through PV verifier (no consensus).
    Paired with text baseline (Config C) to test whether the text-only advantage
    persists at 384px under PV.
  phase: "h11"
  hypothesis: "H11"
  created: "2026-03-21"

carried_forward:
  optimal_me_config: "prompts/configs/library_plus-hp.json"
  optimal_me_name: "plus-hp (brief-text-image)"
  source: "Phase 3a — image-track optimal config"

inputs:
  manifest: "inputs/tiles_384/full_evaluation_manifest.json"
  tile_size: 384
  tiles_dir: "inputs/tiles_384"
  ground_truth: "inputs/vectors/references/mounds-reference.geojson"
  bounds: "inputs/vectors/bounds/384/full_evaluation_bounds.geojson"
  evaluation_bounds: "inputs/vectors/bounds/full_evaluation_bounds.geojson"

execution:
  runs: 1
  workers: 1
  output_dir: "outputs/h11/pv-diag-384/image-baseline"

conditions:
- name: image-t0.0
  config: "prompts/configs/library_plus-hp.json"
  temperature: 0.0
  description: "Image-track proposer, T=0.0, deterministic single-pass baseline"

estimates:
  tiles: 611
  runs: 1
  total_execution_units: 1
  tiles_per_unit: 611
  total_api_calls: 611
  cost_per_call_usd: 0.001
  cost_batch_discount: 0.5
  cost_usd_total: 0.31

analysis:
  method: "pv_evaluation"
  description: |
    Single-pass proposer output fed directly through crop extraction + PV
    verifier. Bootstrap CI evaluation against ground truth. Paired with
    text baseline for modality comparison.
  metrics:
  - "f1"
  - "precision"
  - "recall"
