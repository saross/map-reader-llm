study:
  name: 'Retest: Phase 2c: H8 Library Composition — Track 1 (brief-text-image)'
  version: 2.0-retest
  description: 'Tests 5 library compositions to determine optimal example set.

    Uses optimal M/E from Phase 2a (brief-text-image, F1=0.4617) and

    optimal temperature from Phase 2b (T=0.0, F1=0.5574).

    Results inform library used in subsequent phases (2d-2e).

    Scale-16 and Scale-32 deferred per E11 (HP pool exhausted at 4).


    Dual-track context: Phase 2a found text-only brief-text (F1=0.5425)

    outperformed all image-using conditions, but no pairwise differences

    survived FDR correction. Both M/E levels are carried forward

    independently. See Decision 16, Erratum E27.

    '
  phase: 2c
  hypothesis: H8
  created: '2026-01-21'
  updated: '2026-02-08'
  retest_notes: H8 library composition Track 1 (image-using). All at T=0.0.
carried_forward:
  optimal_me_config: prompts/configs/detect_brief-text-image.json
  optimal_me_name: brief-text-image
  optimal_temperature: 0.0
  source_2a: Phase 2a — best image-using M/E (F1=0.4617)
  source_2b: Phase 2b Track 1 — optimal temperature (T=0.0, F1=0.5574)
factors:
  library_composition:
    description: Example library composition and scaling
    levels:
    - name: pure-positive-canon
      config: prompts/configs/library_pure-positive-canon.json
      description: Canon+ (4), null (3) = 7 examples
      composition:
        canonical_positive: 4
        canonical_negative: 0
        hard_positive: 0
        hard_negative: 0
        null_examples: 3
        total: 7
    - name: canonical
      config: prompts/configs/library_canonical.json
      description: Canon+ (4), Canon- (2), null (3) = 9 examples
      composition:
        canonical_positive: 4
        canonical_negative: 2
        hard_positive: 0
        hard_negative: 0
        null_examples: 3
        total: 9
    - name: plus-hp
      config: prompts/configs/library_plus-hp.json
      description: Canon+ (4), HP (4), Canon- (2), null (3) = 13 examples
      composition:
        canonical_positive: 4
        canonical_negative: 2
        hard_positive: 4
        hard_negative: 0
        null_examples: 3
        total: 13
    - name: scale-4
      config: prompts/configs/library_scale-4.json
      description: Canon+ (4), HP (2), Canon- (2), HN (2), null (3) = 13 examples
      composition:
        canonical_positive: 4
        canonical_negative: 2
        hard_positive: 2
        hard_negative: 2
        null_examples: 3
        total: 13
    - name: scale-8
      config: prompts/configs/library_scale-8.json
      description: Canon+ (4), HP (4), Canon- (2), HN (4), null (3) = 17 examples
      composition:
        canonical_positive: 4
        canonical_negative: 2
        hard_positive: 4
        hard_negative: 4
        null_examples: 3
        total: 17
fixed:
  ordering: canonical-first
inputs:
  manifest: inputs/tiles/full_evaluation_manifest.json
  ground_truth: inputs/vectors/references/mounds-reference.geojson
  bounds: inputs/vectors/bounds/full_evaluation_bounds.geojson
execution:
  runs: 1
  output_dir: outputs/retest/phase2c/track1-image
  checkpoint_dir: outputs/phase2c/track1-image/checkpoints
command_template: "python scripts/4_detect_mounds_batch.py \\\n  --config {factor_config} \\\n  --manifest\
  \ {inputs.manifest} \\\n  --output-dir {output_dir}/{condition_name}/run_{run}/pass_{pass} \\\n  --temperature\
  \ {carried_forward.optimal_temperature}\n"
analysis:
  method: bootstrap_ci
  n_iterations: 1000
  fdr_q: 0.05
  planned_contrasts:
  - - pure-positive-canon
    - canonical
  - - canonical
    - plus-hp
  - - plus-hp
    - scale-4
  - - scale-4
    - scale-8
  metrics:
  - f1
  - precision
  - recall
  output:
    report: outputs/phase2c/track1-image/analysis_report.json
    summary: outputs/phase2c/track1-image/analysis_summary.md
outputs:
  per_condition:
  - '{output_dir}/{condition_name}/run_{run}/*.geojson'
  - '{output_dir}/{condition_name}/run_{run}/*.meta.json'
  aggregated:
  - '{output_dir}/results_summary.csv'
  - '{output_dir}/analysis_report.json'
estimates:
  cells: 5
  api_calls_per_cell: 340
  total_api_calls: 1700
  cost_usd: 11
  time_hours: 1
  original_runs: 5
  retest_runs: 1
  retest_tiles: 340
outcome:
  determines: optimal_library_image_track
  carries_forward_to: phase2d
  decision_rule: 'Select library with highest mean F1.

    If multiple libraries have overlapping 95% CIs with the best,

    prefer smaller library (fewer examples) for parsimony.

    Note: Scale-16/32 deferred per E11 (HP pool exhausted at 4).

    Optimal library is carried forward independently for the image track.

    '
