study:
  name: 'Retest: Phase 3a: H3 Consensus Voting — Track 2 (Text-Only, HIGH Thinking)'
  version: 2.0-retest
  description: >
    Tests consensus voting with HIGH thinking level at elevated temperatures
    (T=0.3, T=0.7, T=1.0) using the text-only configuration with HIGH
    thinking enabled.

    T=0.7 data already exists in the Phase 3a replication study
    (outputs/retest/phase3a-replication/high/). This study adds T=0.3
    and T=1.0 to complete the temperature sweep and enable comparison
    with the minimal thinking text track.

    The replication study found HIGH thinking + consensus at T=0.7
    achieves F1=0.771 (21-of-30) — the best result in the study.
  phase: 3a
  hypothesis: H3
  created: '2026-03-17'
  retest_notes: >
    H3 consensus voting Track 2 (text-only) with HIGH thinking.
    K=30 for full threshold sweep. T=0.7 already available from
    the replication study; T=0.3 and T=1.0 are new.
carried_forward:
  optimal_me_config: prompts/configs/detect_brief-text-high.json
  optimal_me_name: brief-text-high (text-only, HIGH thinking)
  source: Phase 3a replication — HIGH thinking + consensus voting (F1=0.771 at T=0.7)
factors:
  temperature:
    description: Model temperature (controls output randomness for consensus voting diversity)
    levels:
    - name: T0.3
      value: 0.3
      description: Low variance — tests whether modest stochasticity enables FP filtering
    - name: T0.7
      value: 0.7
      description: Moderate variance — optimal in replication study (F1=0.771)
    - name: T1.0
      value: 1.0
      description: Vendor default — tests whether high diversity improves consensus
fixed:
  ordering: config-default
inputs:
  manifest: inputs/tiles/full_evaluation_manifest.json
  ground_truth: inputs/vectors/references/mounds-reference.geojson
  bounds: inputs/vectors/bounds/full_evaluation_bounds.geojson
execution:
  runs: 30
  workers: 1
  output_dir: outputs/retest/phase3a-high/track2-text
  checkpoint_dir: outputs/retest/phase3a-high/track2-text/checkpoints
command_template: >
  python scripts/4_detect_mounds_batch.py \
    --config {carried_forward.optimal_me_config} \
    --manifest {inputs.manifest} \
    --output-dir {output_dir}/{condition_name}/run_{run} \
    --temperature {factor_value}
analysis:
  method: consensus_sweep
  script: scripts/analyse_consensus_sweep.py
  args:
  - --study-dir
  - outputs/retest/phase3a-high/track2-text
  - --output-dir
  - results/retest/phase3a-consensus/track2-text-high
  - --temperatures
  - T0.3
  - T0.7
  - T1.0
  - --pool-sizes
  - '5'
  - '10'
  - '30'
  metrics:
  - f1
  - precision
  - recall
  output:
    report: results/retest/phase3a-consensus/track2-text-high/consensus-analysis-report.json
    summary: results/retest/phase3a-consensus/track2-text-high/consensus-analysis-summary.md
outputs:
  per_condition:
  - '{output_dir}/{condition_name}/run_{run}/*.geojson'
  - '{output_dir}/{condition_name}/run_{run}/*.meta.json'
  aggregated:
  - results/retest/phase3a-consensus/track2-text-high/consensus-sweep-results.csv
  - results/retest/phase3a-consensus/track2-text-high/consensus-analysis-report.json
estimates:
  cells: 3
  api_calls_per_cell: 10200
  total_api_calls: 30600
  cost_usd_total: 5
  time_hours: 2
  retest_runs: 30
  retest_tiles: 340
outcome:
  determines: consensus_voting_value_text_track_high_thinking
  decision_rule: >
    Compare HIGH thinking consensus optima at T=0.3, T=0.7, T=1.0
    against minimal thinking text track consensus optima. T=0.7
    replication data (F1=0.771) serves as the reference point.
