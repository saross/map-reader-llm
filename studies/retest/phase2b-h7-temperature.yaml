study:
  name: 'Retest: Phase 2b: H7 Temperature — Track 1 (brief-text-image)'
  version: 2.0-retest
  description: 'Tests 5 temperature levels at the best image-using M/E from Phase 2a

    (brief-text-image, F1=0.4617). Results inform temperature used in

    subsequent image-track phases (2c-2e).


    Dual-track context: Phase 2a found text-only brief-text (F1=0.5425)

    outperformed all image-using conditions, but no pairwise differences

    survived FDR correction. Both the best text-only and best image-using

    M/E levels are carried forward independently. See Decision 16.

    '
  phase: 2b
  hypothesis: H7
  created: '2026-01-21'
  updated: '2026-02-06'
  retest_notes: H7 temperature Track 1 (image-using). T=0.0 runs redundant but cheap.
carried_forward:
  optimal_me_config: prompts/configs/detect_brief-text-image.json
  optimal_me_name: brief-text-image
  source: Phase 2a — best image-using M/E (F1=0.4617)
factors:
  temperature:
    description: Model temperature (controls output randomness)
    levels:
    - name: T0.0
      value: 0.0
      description: Minimum (deterministic)
    - name: T0.3
      value: 0.3
      description: Low variance
    - name: T0.7
      value: 0.7
      description: Moderate variance
    - name: T1.0
      value: 1.0
      description: Vendor default (also tested in Phase 2a)
    - name: T1.3
      value: 1.3
      description: Above default
fixed:
  ordering: canonical-first
inputs:
  manifest: inputs/tiles/full_evaluation_manifest.json
  ground_truth: inputs/vectors/references/mounds-reference.geojson
  bounds: inputs/vectors/bounds/full_evaluation_bounds.geojson
execution:
  runs: 3
  output_dir: outputs/retest/phase2b/track1-image
  checkpoint_dir: outputs/phase2b/track1-image/checkpoints
command_template: "python scripts/4_detect_mounds_batch.py \\\n  --config {carried_forward.optimal_me_config}\
  \ \\\n  --manifest {inputs.manifest} \\\n  --output-dir {output_dir}/{condition_name}/run_{run}/pass_{pass}\
  \ \\\n  --temperature {factor_value}\n"
analysis:
  method: bootstrap_ci
  n_iterations: 1000
  fdr_q: 0.05
  planned_contrasts:
  - - T1.0
    - T0.0
  - - T1.0
    - T0.3
  - - T1.0
    - T0.7
  - - T1.0
    - T1.3
  metrics:
  - f1
  - precision
  - recall
  output:
    report: outputs/phase2b/track1-image/analysis_report.json
    summary: outputs/phase2b/track1-image/analysis_summary.md
  notes: 'Phase 2a data for brief-text-image at T=1.0 is available in

    outputs/phase2a/brief-text-image/run_* (K=10 runs). This can

    supplement the T=1.0 condition here or serve as a replication check.

    '
outputs:
  per_condition:
  - '{output_dir}/{condition_name}/run_{run}/*.geojson'
  - '{output_dir}/{condition_name}/run_{run}/*.meta.json'
  aggregated:
  - '{output_dir}/results_summary.csv'
  - '{output_dir}/analysis_report.json'
estimates:
  cells: 5
  api_calls_per_cell: 1020
  total_api_calls: 5100
  cost_usd: 11
  time_hours: 1
  original_runs: 5
  retest_runs: 3
  retest_tiles: 340
outcome:
  determines: optimal_temperature_image_track
  carries_forward_to: phase2c
  decision_rule: 'Select temperature with highest mean F1.

    If T=1.0 (default) is within 0.02 F1 of best, prefer T=1.0 for simplicity.

    Optimal temperature is carried forward independently for the image track.

    '
