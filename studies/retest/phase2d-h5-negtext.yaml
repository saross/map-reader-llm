study:
  name: 'Retest: Phase 2d: H5 Negative Text Treatment — Track 1 (brief-text-image)'
  version: 2.0-retest
  description: 'Tests 3 exclusion guidance levels (Minimal, Terse, Verbose) at the

    carried-forward brief-text-image M/E with plus-hp library and T=0.0.


    Minimal is the Phase 2c baseline (no exclusion text beyond basic

    "Negative" label). Terse adds a brief "do not mark" list. Verbose

    adds detailed per-type exclusion criteria with visual/key-difference/

    test structure.


    This is an OFAT simplification of the preregistered 3×3 M/E × H5

    factorial: we test H5 at the carried-forward optimal M/E only.

    See Decision 17.

    '
  phase: 2d
  hypothesis: H5
  created: '2026-01-21'
  updated: '2026-02-11'
  retest_notes: H5 negative text Track 1 (image-using). All at T=0.0.
carried_forward:
  optimal_temperature: 0.0
  optimal_library: plus-hp
  optimal_me: brief-text-image
  source: Phase 2a (M/E), Phase 2b (T=0.0), Phase 2c (plus-hp)
factors:
  negative_text_treatment:
    description: Exclusion guidance level in system instruction
    levels:
    - name: minimal
      description: No exclusion text — baseline from Phase 2c
      config: prompts/configs/library_plus-hp.json
      run_in_phase2d: false
    - name: terse
      description: Brief exclusion guidance (do-not-mark list)
      config: prompts/configs/library_plus-hp_terse.json
      run_in_phase2d: true
    - name: verbose
      description: Detailed per-type exclusion criteria
      config: prompts/configs/library_plus-hp_verbose.json
      run_in_phase2d: true
fixed:
  ordering: canonical-first
  temperature: 0.0
  library: plus-hp
  me_level: brief-text-image
inputs:
  manifest: inputs/tiles/full_evaluation_manifest.json
  ground_truth: inputs/vectors/references/mounds-reference.geojson
  bounds: inputs/vectors/bounds/full_evaluation_bounds.geojson
execution:
  runs: 1
  output_dir: outputs/retest/phase2d/track1-image
  checkpoint_dir: outputs/phase2d/track1-image/checkpoints
  cells_to_run: 2
command_template: "python scripts/4_detect_mounds_batch.py \\\n  --config {condition_config} \\\n  --manifest\
  \ {inputs.manifest} \\\n  --output-dir {output_dir}/{condition_name}/run_{run} \\\n  --temperature {carried_forward.optimal_temperature}\n"
analysis:
  method: bootstrap_ci
  n_iterations: 1000
  fdr_q: 0.05
  design: one_way
  planned_contrasts:
  - - minimal
    - terse
  - - terse
    - verbose
  metrics:
  - f1
  - precision
  - recall
  output:
    report: outputs/phase2d/track1-image/analysis_report.json
    summary: outputs/phase2d/track1-image/analysis_summary.md
outputs:
  per_condition:
  - '{output_dir}/{condition_name}/run_{run}/*.geojson'
  - '{output_dir}/{condition_name}/run_{run}/*.meta.json'
  aggregated:
  - '{output_dir}/results_summary.csv'
  - '{output_dir}/analysis_report.json'
estimates:
  cells: 2
  api_calls_per_cell: 340
  total_api_calls: 680
  cost_usd: 4.4
  time_hours: 0.5
  original_runs: 2
  retest_runs: 1
  retest_tiles: 340
outcome:
  determines: optimal_h5_treatment_image_track
  carries_forward_to: phase2e
  decision_rule: "Compare F1 across 3 H5 levels (minimal, terse, verbose).\nIf terse or verbose significantly\
    \ improves F1 over minimal:\n  Select level with highest mean F1.\nIf no significant differences:\n\
    \  Use Minimal (simplest) as default — Occam's razor.\nOptimal H5 level carried forward to Phase 2e\
    \ (ordering).\n"
