# Pairwise Comparison Definitions
# =================================
# 32 comparisons across 7 groups, implementing the proposal in
# planning/pairwise-comparison-proposal.md.
#
# Each comparison specifies condition A and B with their type
# (consensus, pv, or n1) and parameters. The orchestration script
# builds detection GeoDataFrames and runs the permutation test.
#
# Created: 2026-03-28

metadata:
  description: "32 pairwise permutation tests for paper"
  n_permutations: 10000
  seed: 42

defaults:
  bounds: inputs/vectors/bounds/384/full_evaluation_bounds.geojson
  ground_truth: inputs/vectors/references/mounds-reference.geojson

comparisons:
