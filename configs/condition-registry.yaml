    threshold: 0.20

  - label: "pro-high-text-3-of-5--flash-min-vf (t=0.15)"
    type: pv
    probabilities: outputs/h11/pv-diag-384/verified/pro-high-text-flash-min-vf-3of5/probabilities.json
    manifest: outputs/h11/pv-diag-384/verified/pro-high-text-flash-min-vf-3of5/candidate_manifest.json
    threshold: 0.15

  - label: "flash-high-image-3-of-5--flash-min-vf (t=0.15)"
    type: pv
    probabilities: outputs/h11/pv-diag-384/verified/flash-high-image-3of5/probabilities.json
    manifest: outputs/h11/pv-diag-384/verified/flash-high-image-3of5/candidate_manifest.json
    threshold: 0.15

  - label: "text-baseline--flash-min-vf (t=0.15)"
    type: pv
    probabilities: outputs/h11/pv-diag-384/verified/text-baseline/probabilities.json
    manifest: outputs/h11/pv-diag-384/crops/text-baseline/candidate_manifest.json
    threshold: 0.15

  - label: "image-baseline--flash-min-vf (t=0.2)"
    type: pv
    probabilities: outputs/h11/pv-diag-384/verified/image-baseline/probabilities.json
    manifest: outputs/h11/pv-diag-384/crops/image-baseline/candidate_manifest.json
    threshold: 0.20

  # ── Consensus conditions — HIGH thinking ───────────────────────
  - label: "pro-high-text N=5 N=5, 3-of-5"
    type: consensus
    study_dir: outputs/h11/pv-diag-384/pro-high-text-n5
    config: "text-t0.7,5,3"

  - label: "flash-high-text N=30 N=30, 26-of-30"
    type: consensus
    study_dir: outputs/h11/pv-diag-384/flash-high-text-n5
    config: "text-t0.7,30,26"

  - label: "pro-high-image N=5 N=5, 3-of-5"
    type: consensus
