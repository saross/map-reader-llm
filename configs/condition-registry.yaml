# Condition Registry — Maps leaderboard conditions to detection sources
# =====================================================================
# Used by run_pairwise_tests.py --leaderboard mode to look up detection
# source parameters for each condition in metrics_master.csv.
#
# Labels must match the output of _build_leaderboard_label() exactly:
#   PV:        "{condition_label} ({config_details})"
#   Consensus: "{condition_label} N={pool_size} {config_details}"
#
# Note: Some consensus conditions have different optimal thresholds at
# different buffer distances (e.g., FH image N=10 is 6-of-10 at 30m
# but 7-of-10 at 20m). Both threshold variants are included so the
# registry works at any evaluation buffer.
#
# Created: 2026-03-28
# Updated: 2026-03-29 — added 20m-optimal threshold variants

conditions:
  # ── PV conditions ──────────────────────────────────────────────
  - label: "flash-high-text-16-of-30--flash-min-vf (t=0.2)"
    type: pv
    probabilities: outputs/h11/pv-diag-384/verified/flash-high-text-16of30/probabilities.json
    manifest: outputs/h11/pv-diag-384/verified/flash-high-text-16of30/candidate_manifest.json
    threshold: 0.20

  - label: "flash-high-text-4-of-5--flash-min-vf (t=0.15)"
    type: pv
    probabilities: outputs/h11/pv-diag-384/verified/flash-high-text-4of5/probabilities.json
    manifest: outputs/h11/pv-diag-384/verified/flash-high-text-4of5/candidate_manifest.json
    threshold: 0.15

  - label: "flash-high-text-4-of-5--flash-medium-vf (t=0.95)"
    type: pv
    probabilities: outputs/h11/pv-diag-384/verified/flash-high-text-medium-vf-4of5/probabilities.json
    manifest: outputs/h11/pv-diag-384/verified/flash-high-text-medium-vf-4of5/candidate_manifest.json
    threshold: 0.95

  - label: "flash-high-text-9-of-10--flash-min-vf (t=0.2)"
    type: pv
    probabilities: outputs/h11/pv-diag-384/verified/flash-high-text-9of10/probabilities.json
