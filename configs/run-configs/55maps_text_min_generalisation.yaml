# 55-Map Text Generalisation Run — MIN thinking (cost-optimised)
# ==============================================================
#
# Paired comparison against the 2026-04-10 text HIGH run. The
# scientifically relevant differences from
# `55maps_text_generalisation_retrospective.yaml` are:
#
#   - thinking_level: high  →  minimal   (the factor under test)
#   - run_name: 55maps-text-generalisation  →  55maps-text-min-generalisation
#
# One orchestration parameter also differs — `workers: 60 → 250`, to
# exploit Tier 3 throughput (the original HIGH run used the old
# launcher default). Worker count has no effect on per-call model
# output, only wall-clock and retry behaviour, so it does not
# confound the thinking-level comparison.
#
# Everything affecting the API payload (config, K, vote_threshold,
# verifier, prob_threshold, buffers, bootstrap, seed) is held
# identical so any F1 difference we observe is attributable to the
# thinking-level change.
# Planned analysis:
#   - Run under scripts/run_generalisation.py so cost/provenance
#     are fully captured (unlike the retrospective HIGH run).
#   - Evaluate at matched prob_t=0.15 / vote_t=4.
#   - Paired permutation test on per-tile TP/FP/FN between MIN
#     detections and HIGH detections (both vs the student GT),
#     10,000 iterations, seed=42. Determines whether the ~$10
#     MIN-thinking cost saving comes with a detectable F1 loss.
#
# Budget: ~$65 at Flex tier (proposer ~$55 + verifier ~$13). If the
# paired test returns p > 0.05, MIN becomes the preferred text
# operating point per the "≥10 % cheaper + statistically
# indistinguishable" rule; if p ≤ 0.05, HIGH's $10 premium is
# justified.

run_name: 55maps-text-min-generalisation
output_root: outputs
service_tier: flex

# ---------------------------------------------------------------------------
# Stage 1: proposer — matches original text run EXCEPT thinking_level
# ---------------------------------------------------------------------------
proposer:
  config: prompts/configs/detect_brief-text.json
  manifest: inputs/tiles_384_55maps/full_evaluation_manifest.json
  tiles_dir: inputs/tiles_384_55maps
  tile_size: 384
  temperature: 0.7
  thinking_level: minimal    # ← ONLY DIFFERENCE from HIGH run
  passes: 5
  mode: realtime
  workers: 250               # Tier 3 max; ~1.7× faster than 60
  max_retries: 15
  use_cache: true

# ---------------------------------------------------------------------------
# Stage 2: consensus — matches original text run
# ---------------------------------------------------------------------------
consensus:
  vote_threshold: 4         # 4-of-5, matching the 2026-04-10 text run
                            # (text-track sweep optimum, distinct from
                            # image track's 3-of-5)
  dedup_radius_m: 20.0

# ---------------------------------------------------------------------------
# Stage 3: extract — matches original text run
# ---------------------------------------------------------------------------
extract:
  padding: 75
  rasters_dir: inputs/rasters/Russian1981_32635
  tiles_dir: inputs/tiles_384_55maps

# ---------------------------------------------------------------------------
# Stage 4: verifier — text-only adversarial v1 (matches original)
# ---------------------------------------------------------------------------
verify:
  config: prompts/configs/verify_adversarial-text.json
  mode: realtime
  workers: 20

# ---------------------------------------------------------------------------
# Stage 5: evaluation — matches original text run
# ---------------------------------------------------------------------------
evaluate:
  prob_threshold: 0.15      # v1 @ 0.15 was the matched operating point
  buffers: [20, 30, 40, 50]
  bootstrap: 1000
  seed: 42
  ground_truth: inputs/vectors/references/student-mounds-55maps.geojson
  bounds: inputs/vectors/bounds/384/55maps_evaluation_bounds.geojson
