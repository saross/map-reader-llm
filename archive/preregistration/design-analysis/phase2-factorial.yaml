# Phase 2: Core Factorial Experiment
# ===================================
# Tests H1 (modality), H4 (ordering), H5 (hard negatives), H7 (temperature)
# Full 3×3×2×4 = 72 condition factorial design (3 M/E levels)
#
# Usage:
#   python scripts/run_study.py studies/phase2-factorial.yaml
#   python scripts/run_study.py studies/phase2-factorial.yaml --dry-run
#   python scripts/run_study.py studies/phase2-factorial.yaml --resume

study:
  name: "Phase 2 Core Factorial"
  version: "1.0"
  description: |
    72-condition factorial testing H1 (modality), H4 (ordering),
    H5 (hard negatives), H7 (temperature) on Gemini 3 Flash.
  hypotheses: ["H1", "H4", "H5", "H7"]
  random_seed: 20251231
  created: "2025-12-31"

# Default parameters applied to all conditions unless overridden
defaults:
  model: "gemini-3-flash"
  passes: 5
  workers: 4
  manifest: "inputs/holdout_manifest.json"
  output_dir: "outputs/phase2-factorial"
  max_retries: 3
  retry_delay_seconds: 5

# Factorial design specification
# Each factor defines levels; the runner generates the Cartesian product
factors:
  # H1: Modality (image-only vs brief-text-image vs verbose-text-image)
  modality:
    - id: "image-only"
      config_base: "detect_image-only"
      description: "Minimal text, image examples only"
    - id: "brief-text-image"
      config_base: "detect_brief-text-image"
      description: "Brief text + image examples"
    - id: "verbose-text-image"
      config_base: "detect_verbose-text-image"
      description: "Verbose text + image examples"

  # H4: Example ordering
  ordering:
    - id: "canonical-first"
      config_suffix: ""  # Base config has canonical-first
      description: "H4-A: Legend positives first, then nulls"
    - id: "canonical-last"
      config_suffix: "_canonical-last"
      description: "H4-B: Hard examples first, legend last"
    - id: "random"
      config_suffix: "_random-order"
      description: "H4-C: Random permutation (seed 42)"

  # H5: Hard negative examples
  hard_negatives:
    - id: "baseline"
      config_suffix: ""
      description: "Positive examples + null tiles only"
    - id: "hardneg"
      config_suffix: "_hardneg"
      description: "Includes hard negative examples"

  # H7: Temperature
  temperature:
    - id: "T0.0"
      value: 0.0
      description: "Deterministic output"
    - id: "T0.3"
      value: 0.3
      description: "Low stochasticity"
    - id: "T0.7"
      value: 0.7
      description: "Moderate stochasticity"
    - id: "T1.0"
      value: 1.0
      description: "Vendor recommended (Gemini 3)"

# Execution control
execution:
  # Randomise condition order to distribute temporal effects
  randomise_order: true

  # Checkpoint frequency (save progress every N conditions)
  checkpoint_every: 10

  # Resume from checkpoint if available
  resume_enabled: true

  # Stop on first error or continue with remaining conditions
  stop_on_error: false

  # Quality control checks
  qc:
    # Pause if parsing failure rate exceeds threshold
    max_parse_failure_rate: 0.05
    # Pause if API error rate exceeds threshold
    max_api_error_rate: 0.10

# Output specification
outputs:
  # Raw API responses
  raw_responses: "{output_dir}/raw/{condition_id}/{tile_id}_pass{pass}.json"
  # Aggregated per-condition results
  condition_results: "{output_dir}/results/{condition_id}.geojson"
  # Study-level outputs
  checkpoint_file: "{output_dir}/checkpoint.json"
  manifest_file: "{output_dir}/study_manifest.json"
  summary_file: "{output_dir}/study_summary.csv"
