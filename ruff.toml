# Ruff linter configuration
# https://docs.astral.sh/ruff/configuration/

# The project's single lint configuration (pyproject.toml carries none).
line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "W"]
ignore = [
    # E402: Module level import not at top of file
    # Intentionally ignored - scripts use sys.path manipulation before imports
    "E402",
]
# E501 (line too long, at 100) is enforced since 2026-10-07. Lines already
# over 100 characters are legacy debt, fixed when their file is touched.

[lint.per-file-ignores]
# Test files may have unused variables for fixtures/assertions
"tests/*.py" = ["F841"]
